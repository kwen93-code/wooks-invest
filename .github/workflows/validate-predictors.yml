name: ETF predictor walk-forward validation
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'
  push:
    paths:
      - 'research/validate_predictors.py'
      - '.github/workflows/validate-predictors.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r research/requirements.txt
      - run: python research/validate_predictors.py
      - name: Commit measured report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/validation_results.json
          git diff --cached --quiet || (git commit -m "Update measured ETF predictor evaluation" && git push)
